<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Well - インベーダーゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <header>
      <h1>Gravity Well</h1>
      <div id="score-board">
        <span>スコア: <span id="score">0</span></span>
        <span>ライフ: <span id="lives">3</span></span>
      </div>
    </header>
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="controls">
      <p>← → で移動 | スペースで発射 | <strong>クリック</strong>で重力井戸を設置</p>
    </div>
    <div id="game-over" class="hidden">
      <h2>ゲームオーバー</h2>
      <p>最終スコア: <span id="final-score">0</span></p>
      <button id="restart-btn">もう一度プレイ</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
