<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gravity Invader</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #151a24;
      --accent: #6ee7b7;
      --accent-dim: #34d399;
      --danger: #f87171;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --font: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      border: 2px solid var(--accent-dim);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(110, 231, 183, 0.15);
    }

    canvas {
      display: block;
      background: var(--bg);
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(11, 14, 20, 0.85);
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    #ui-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #ui-overlay h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(110, 231, 183, 0.4);
    }

    #ui-overlay .subtitle {
      color: var(--text-dim);
      font-size: 1rem;
      margin-bottom: 1.5rem;
      text-align: center;
      line-height: 1.6;
    }

    #ui-overlay .subtitle strong {
      color: var(--accent);
    }

    #start-btn {
      padding: 0.75rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(110, 231, 183, 0.5);
    }

    #start-btn:active {
      transform: scale(0.98);
    }

    #score-display {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      z-index: 5;
    }

    #score-display span {
      color: var(--accent);
    }

    #gravity-indicator {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 0.9rem;
      color: var(--text-dim);
      z-index: 5;
    }

    #gravity-indicator.active {
      color: var(--accent);
    }

    #controls-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: var(--text-dim);
      z-index: 5;
      text-align: center;
    }

    #game-over-score {
      font-size: 1.5rem;
      color: var(--accent);
      margin: 0.5rem 0 1rem;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="600" height="700"></canvas>
    <div id="score-display">Score: <span id="score">0</span></div>
    <div id="gravity-indicator">Gravity: OFF</div>
    <div id="controls-hint">← → Move | SPACE Shoot | G Gravity</div>
    <div id="ui-overlay">
      <h1>Gravity Invader</h1>
      <div class="subtitle">
        <strong>Gravity Shift</strong> — bullets fall with gravity!<br />
        Press <strong>G</strong> to toggle gravity mode.<br />
        Use the curved bullet paths to your advantage.
      </div>
      <div id="game-over-score" style="display:none;"></div>
      <button id="start-btn">Start Game</button>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const overlay = document.getElementById("ui-overlay");
      const startBtn = document.getElementById("start-btn");
      const scoreEl = document.getElementById("score");
      const gameOverScoreEl = document.getElementById("game-over-score");
      const gravityIndicator = document.getElementById("gravity-indicator");

      const W = canvas.width;
      const H = canvas.height;

      // Game state
      let gameRunning = false;
      let score = 0;
      let gravityMode = false;
      let lastTime = 0;
      let enemySpawnTimer = 0;
      let enemySpawnInterval = 1.5;
      let difficultyTimer = 0;

      // Player
      const player = {
        x: W / 2,
        y: H - 60,
        width: 40,
        height: 30,
        speed: 300,
        color: "#6ee7b7",
      };

      // Bullets
      let bullets = [];
      const bulletSpeed = 400;
      const gravity = 600;

      // Enemies
      let enemies = [];
      const enemyWidth = 36;
      const enemyHeight = 28;
      const enemySpeed = 80;

      // Particles
      let particles = [];

      // Keys
      const keys = {};

      // Event listeners
      document.addEventListener("keydown", (e) => {
        keys[e.code] = true;
        if (e.code === "KeyG" && gameRunning) {
          gravityMode = !gravityMode;
          gravityIndicator.textContent = `Gravity: ${gravityMode ? "ON" : "OFF"}`;
          gravityIndicator.classList.toggle("active", gravityMode);
        }
        if (e.code === "Space" && gameRunning) {
          e.preventDefault();
          shoot();
        }
      });

      document.addEventListener("keyup", (e) => {
        keys[e.code] = false;
      });

      startBtn.addEventListener("click", startGame);

      function startGame() {
        score = 0;
        scoreEl.textContent = "0";
        gravityMode = false;
        gravityIndicator.textContent = "Gravity: OFF";
        gravityIndicator.classList.remove("active");
        player.x = W / 2;
        bullets = [];
        enemies = [];
        particles = [];
        enemySpawnTimer = 0;
        enemySpawnInterval = 1.5;
        difficultyTimer = 0;
        gameRunning = true;
        overlay.classList.add("hidden");
        gameOverScoreEl.style.display = "none";
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
      }

      function gameOver() {
        gameRunning = false;
        overlay.classList.remove("hidden");
        startBtn.textContent = "Play Again";
        gameOverScoreEl.style.display = "block";
        gameOverScoreEl.textContent = `Final Score: ${score}`;
      }

      function shoot() {
        bullets.push({
          x: player.x,
          y: player.y - player.height / 2,
          vx: 0,
          vy: -bulletSpeed,
          radius: 3,
          gravity: gravityMode ? gravity : 0,
          color: gravityMode ? "#fbbf24" : "#6ee7b7",
          trail: [],
        });
      }

      function spawnEnemy() {
        const cols = 8;
        const spacing = W / cols;
        const col = Math.floor(Math.random() * cols);
        const x = col * spacing + spacing / 2;
        enemies.push({
          x: x,
          y: -enemyHeight,
          width: enemyWidth,
          height: enemyHeight,
          speed: enemySpeed + Math.random() * 40,
          color: "#f87171",
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 1 + Math.random() * 2,
          wobbleAmp: 20 + Math.random() * 30,
        });
      }

      function createExplosion(x, y, color) {
        for (let i = 0; i < 12; i++) {
          const angle = (Math.PI * 2 * i) / 12;
          const speed = 50 + Math.random() * 100;
          particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.5 + Math.random() * 0.3,
            maxLife: 0.5 + Math.random() * 0.3,
            color: color,
            size: 2 + Math.random() * 3,
          });
        }
      }

      function update(dt) {
        // Player movement
        if (keys["ArrowLeft"] || keys["KeyA"]) {
          player.x -= player.speed * dt;
        }
        if (keys["ArrowRight"] || keys["KeyD"]) {
          player.x += player.speed * dt;
        }
        player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, player.x));

        // Spawn enemies
        enemySpawnTimer += dt;
        if (enemySpawnTimer >= enemySpawnInterval) {
          enemySpawnTimer = 0;
          spawnEnemy();
        }

        // Increase difficulty
        difficultyTimer += dt;
        if (difficultyTimer >= 10) {
          difficultyTimer = 0;
          enemySpawnInterval = Math.max(0.4, enemySpawnInterval - 0.1);
        }

        // Update bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 6) b.trail.shift();
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.gravity > 0) {
            b.vy += b.gravity * dt;
          }
          if (b.y < -10 || b.y > H + 10 || b.x < -10 || b.x > W + 10) {
            bullets.splice(i, 1);
          }
        }

        // Update enemies
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.y += e.speed * dt;
          e.wobble += e.wobbleSpeed * dt;
          e.x += Math.sin(e.wobble) * e.wobbleAmp * dt;

          // Check collision with player
          if (
            e.x - e.width / 2 < player.x + player.width / 2 &&
            e.x + e.width / 2 > player.x - player.width / 2 &&
            e.y - e.height / 2 < player.y + player.height / 2 &&
            e.y + e.height / 2 > player.y - player.height / 2
          ) {
            createExplosion(player.x, player.y, player.color);
            gameOver();
            return;
          }

          // Remove if off screen
          if (e.y > H + 50) {
            enemies.splice(i, 1);
          }
        }

        // Bullet-enemy collision
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
          const b = bullets[bi];
          for (let ei = enemies.length - 1; ei >= 0; ei--) {
            const e = enemies[ei];
            if (
              b.x > e.x - e.width / 2 &&
              b.x < e.x + e.width / 2 &&
              b.y > e.y - e.height / 2 &&
              b.y < e.y + e.height / 2
            ) {
              createExplosion(e.x, e.y, e.color);
              enemies.splice(ei, 1);
              bullets.splice(bi, 1);
              score += 10;
              scoreEl.textContent = score;
              break;
            }
          }
        }

        // Update particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Draw stars
        ctx.fillStyle = "#ffffff";
        for (let i = 0; i < 50; i++) {
          const sx = (i * 137.5) % W;
          const sy = (i * 97.3 + performance.now() * 0.01) % H;
          const size = (i % 3) + 1;
          ctx.globalAlpha = 0.3 + (i % 5) * 0.1;
          ctx.fillRect(sx, sy, size, size);
        }
        ctx.globalAlpha = 1;

        // Draw player
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.height / 2);
        ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
        ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
        ctx.closePath();
        ctx.fill();

        // Draw bullets
        for (const b of bullets) {
          // Trail
          for (let t = 0; t < b.trail.length; t++) {
            const alpha = (t + 1) / b.trail.length * 0.5;
            ctx.fillStyle = b.color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(b.trail[t].x, b.trail[t].y, b.radius * 0.7, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          // Bullet
          ctx.fillStyle = b.color;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw enemies
        for (const e of enemies) {
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.moveTo(e.x, e.y - e.height / 2);
          ctx.lineTo(e.x - e.width / 2, e.y + e.height / 2);
          ctx.lineTo(e.x + e.width / 2, e.y + e.height / 2);
          ctx.closePath();
          ctx.fill();

          // Enemy eyes
          ctx.fillStyle = "#0b0e14";
          ctx.beginPath();
          ctx.arc(e.x - 6, e.y, 3, 0, Math.PI * 2);
          ctx.arc(e.x + 6, e.y, 3, 0, Math.PI * 2);
          ctx.fill();
        }

        // Draw particles
        for (const p of particles) {
          const alpha = p.life / p.maxLife;
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function gameLoop(timestamp) {
        if (!gameRunning) return;
        const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;
        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
      }

      // Initial draw
      draw();
    })();
  </script>
</body>
</html>
