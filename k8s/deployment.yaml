apiVersion: apps/v1
kind: Deployment
metadata:
  name: invader-game
  labels:
    app: invader-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invader-game
  template:
    metadata:
      labels:
        app: invader-game
    spec:
      containers:
        - name: invader-game
          image: invader-game:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
