name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  go-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod download
        working-directory: ./server

      - name: Build
        run: go build -v ./...
        working-directory: ./server

      - name: Run tests
        run: go test -v ./...
        working-directory: ./server

      - name: Lint
        run: go vet ./...
        working-directory: ./server

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Run helm lint
        run: helm lint charts/invader-game
