name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: |
          cd server
          go mod download

      - name: Run linter
        run: |
          cd server
          go vet ./...
          if command -v golangci-lint &> /dev/null; then
            golangci-lint run ./...
          else
            echo "golangci-lint not installed, skipping"
          fi

      - name: Run tests
        run: |
          cd server
          go test -v -race -coverprofile=coverage.out ./...

      - name: Build server
        run: |
          cd server
          go build -o ../server/server ./...

      - name: Validate Dockerfile
        run: |
          if [ -f Dockerfile ]; then
            docker build -t arun-test:ci . || echo "Docker build skipped (no Docker daemon)"
          else
            echo "No Dockerfile found, skipping Docker validation"
          fi

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Run Helm lint
        run: |
          if [ -d charts ]; then
            helm lint charts/ || echo "Helm lint failed"
          else
            echo "No charts directory found, skipping Helm validation"
          fi

  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate frontend assets
        run: |
          if [ -d client ]; then
            echo "Checking frontend directory structure..."
            if [ -f client/index.html ]; then
              echo "✓ index.html found"
            else
              echo "✗ index.html not found"
              exit 1
            fi
          else
            echo "No client directory found, skipping frontend validation"
          fi
