name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm --prefix client test
      - run: npm --prefix client run build
